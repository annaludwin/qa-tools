<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QA Tools</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>🧰 QA Tools</h1>
      <p class="subtitle">Pick a tool to get started.</p>
    </header>

    <div class="tool-grid">
      <a class="tool-card" href="seo/">
        <span class="tool-icon">🔍</span>
        <h2>SEO Analyzer</h2>
        <p>Enter a page address and check its SEO — title, meta tags, headings, and more.</p>
      </a>
      <a class="tool-card" href="regression/">
        <span class="tool-icon">🧪</span>
        <h2>Regression Test Suite</h2>
        <p>Browse test cases, record pass/fail results, and generate reports.</p>
      </a>
    </div>
  </body>
</html>
