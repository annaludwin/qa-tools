<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Regression Tests — Reports</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="report.css" />
  </head>
  <body>
    <header>
      <h1>🧪 Regression Test Suite — Reports</h1>
      <p class="subtitle">History of generated test result reports.</p>
      <p class="subtitle"><a id="back-link" href="index.html">← Back to test cases</a></p>
    </header>

    <div class="tab-nav" id="suite-tabs">
      <button class="tab-btn" data-suite="manual">Manual</button>
      <button class="tab-btn" data-suite="e2e">E2E</button>
    </div>

    <div class="layout">
      <aside class="sidebar">
        <h2 class="panel-heading">Report history</h2>
        <ul id="report-list" class="report-list"></ul>
      </aside>

      <main id="report-view" class="preview">
        <p class="empty-state">Select a report on the left to see its details.</p>
      </main>
    </div>

    <script src="report.js"></script>
  </body>
</html>
